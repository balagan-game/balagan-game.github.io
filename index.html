        if(mode!=='reveal' || shownC!==g.reveal.c){ clearPads(); alb.innerHTML=''; shownI=-1; shownC=g.reveal.c; mode='reveal'; }
        for(let i=shownI+1;i<=g.reveal.i;i++){ const it=albumItem(ch[i], shownI>=0 || i>0); alb.appendChild(it); if(it._pad) pads.push(it._pad); if(i===g.reveal.i && shownI>=0) setTimeout(()=>it.scrollIntoView({behavior:'smooth', block:'center'}),40); }
        shownI=g.reveal.i;
        const lastInChain = g.reveal.i>=ch.length-1, lastChain = g.reveal.c>=A.chains.length-1;
        $('#cta',node).innerHTML = v.isHost
          ? `<button class="btn pink big" data-act="next">${!lastInChain?'Показать дальше':lastChain?'Все цепочки':'Следующая цепочка'}</button>`
          : `<div class="waitnote">Листает ${esc(nameOf(v.hostPid))}</div>`;
      } else if(mode!=='done'){
        mode='done'; clearPads(); alb.innerHTML='';
        $('#pos',node).textContent='Финал'; $('#ttl',node).textContent='Все цепочки';
        A.chains.forEach((ch,ci)=>{ if(ci) alb.appendChild(el('<div class="chain-sep"></div>')); alb.appendChild(el(`<h3>Начал(а) ${esc(nameOf(ch[0].by))}</h3>`)); ch.forEach(it=>{ const n=albumItem(it,false); alb.appendChild(n); if(n._pad) pads.push(n._pad); }); });
        $('#cta',node).innerHTML = v.isHost ? `<div class="row"><button class="btn ghost grow" data-act="lobby">В лобби</button><button class="btn primary grow" data-act="again">Сыграть ещё</button></div>` : `<div class="waitnote">Ждём ведущего</div>`;
      }
    }, destroy:clearPads};
    inst.update(v); return inst;
  }
};

/* ---------- Crocodile ---------- */
function crocHead(g){ const r=Math.floor(g.turn/g.perRound)+1, rounds=Math.ceil(g.total/g.perRound); return gameHead('croc', `<span class="row" style="gap:8px"><span class="tag">Ход ${g.turn+1} из ${g.total}${rounds>1?` · круг ${r}`:''}</span>${timerHtml(g.deadline)}</span>`); }
const MODE_HINT = { gesture:'Показывай жестами и мимикой. Говорить и показывать буквы нельзя.', words:'Объясняй словами. Нельзя называть само слово и однокоренные.' };
const CrocChoose = {
  mount(v){
    const g=v.g;
    const node = el(`<section class="stack" style="gap:18px;--gc:var(--mint)">${crocHead(g)}<div id="b" class="stack" style="gap:14px"></div></section>`);
    const b=$('#b',node);
    if(g.isShower){
      const lab = v.settings.croc.level==='mix' ? ['Лёгкое','Среднее','Сложное'] : [];
      b.innerHTML = `<h2>Твой ход! Выбери слово</h2><p class="muted">${g.mode==='draw'?'Будешь рисовать — остальные угадывают у себя на экранах.':MODE_HINT[g.mode]}</p>
        <div class="choices">${g.options.map((w,i)=>`<button class="choice" data-i="${i}"><span>${esc(w)}</span>${lab[i]?`<small>${lab[i]}</small>`:''}</button>`).join('')}</div>`;
      b.addEventListener('click', e=>{ const c=e.target.closest('[data-i]'); if(c) act('croc-choose',{i:+c.dataset.i}); });
    } else {
      b.innerHTML = `<div class="big-wait">${av(g.shower,'lg')}<h2>${esc(nameOf(g.shower))} выбирает слово</h2><p class="muted">${g.mode==='draw'?'Скоро здесь появится рисунок — пишите догадки в поле внизу.':'Приготовьтесь угадывать вслух.'}</p></div>${scoreboard(v.players.filter(p=>p.inGame))}`;
    }
    return {el:node};
  }
};
function guessFeed(g){
  return g.guesses.slice().reverse().map(x=>x.ok ? `<div class="fmsg ok">${av(x.pid,'sm')}<span>${esc(nameOf(x.pid))} угадал(а)!</span></div>` : `<div class="fmsg">${av(x.pid,'sm')}<b>${esc(nameOf(x.pid))}:</b><span>${esc(x.t)}</span></div>`).join('') || '<p class="small muted">Догадок пока нет.</p>';
}
const CrocDraw = {
  mount(v){
    const g=v.g;
    const node = el(`<section class="stack" style="gap:14px;--gc:var(--mint)">${crocHead(g)}<div id="top"></div><div id="padbox"></div><div id="ctl"></div><div class="card" style="padding:14px"><div class="feed" id="feed"></div></div></section>`);
    let pad;
    if(g.isShower){
      pad = Pad({editable:true, strokes: App.live.turn===g.turn ? App.live.strokes : [],
        onChunk: s=>act('croc-stroke',{s}), onUndo: i=>act('croc-undo',{i}), onClear: ()=>act('croc-clear')});
      $('#ctl',node).innerHTML = `<div class="row"><button class="btn ghost grow" data-act="skip">Другое слово</button><button class="btn ghost grow" data-act="giveup">Сдаться</button></div>`;
    } else {
      pad = Pad({strokes: App.live.turn===g.turn ? App.live.strokes : []});
      if(g.inGame){
        const bar = el(`<form class="guessbar"><input class="input" id="gs" maxlength="40" autocomplete="off" placeholder="Что это?" aria-label="Ваша догадка"><button class="btn mint" type="submit">Отправить</button></form>`);
        bar.addEventListener('submit', e=>{ e.preventDefault(); const i=$('#gs',bar); const t=cleanText(i.value,40); if(!t) return; if(act('croc-guess',{text:t})) i.value=''; i.focus(); });
        node.appendChild(bar);
      }
      if(App.live.turn!==g.turn) act('resync');
    }
    $('#padbox',node).appendChild(pad.el);
    node.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='skip') act('croc-skip');
      if(b.dataset.act==='giveup') armed(b,'Точно сдаться?',()=>act('croc-giveup'));
    });
    let lastWord=null;
    const inst={el:node,
      update(v){
        const g=v.g;
        if(g.isShower){ if(g.word!==lastWord){ lastWord=g.word; $('#top',node).innerHTML=`<div class="row"><span class="eyebrow">Рисуй</span><span class="prompt grow" style="color:var(--mint)">${esc(g.word)}</span></div>`; } }
        else $('#top',node).innerHTML = `<div class="stack" style="gap:8px;align-items:center"><span class="small muted">Рисует ${esc(nameOf(g.shower))} · ${g.hint.reduce((a,b)=>a+b,0)} ${plural(g.hint.reduce((a,b)=>a+b,0),'буква','буквы','букв')}</span><div class="blanks">${g.hint.map(n=>`<span class="wd">${'<i></i>'.repeat(n)}</span>`).join('')}</div></div>`;
        $('#feed',node).innerHTML = guessFeed(g);
      },
      onLive(m){
        if(m.turn!==g.turn) return;
        if(g.isShower){ if(m.t==='clear') pad.clear(); return; }
        if(m.t==='stroke') pad.add(m.s); else if(m.t==='undo') pad.remove(m.i); else if(m.t==='clear') pad.clear(); else if(m.t==='strokes') pad.set(m.all||[]);
      },
      destroy(){ pad.destroy(); }
    };
    inst.update(v); return inst;
  }
};
const CrocAct = {
  mount(v){
    const g=v.g;
    const node = el(`<section class="stack" style="gap:16px;--gc:var(--mint)">${crocHead(g)}<div id="b" class="stack" style="gap:16px"></div></section>`);
    const b=$('#b',node);
    if(g.isShower){
      b.innerHTML = `<div class="wordcard"><span class="eyebrow" style="color:#6E6A8A">${g.mode==='gesture'?'Покажи жестами':'Объясни словами'}</span><div class="w" id="w"></div><p class="hint">${MODE_HINT[g.mode]}</p></div>
        <div class="stack" style="gap:10px"><h3>Кто угадал первым?</h3><div class="hits">${v.players.filter(p=>p.inGame && p.pid!==g.shower).map(p=>`<button class="hit" data-hit="${esc(p.pid)}">${av(p.pid,'sm')}<span>${esc(p.name)}</span></button>`).join('')}</div></div>
        <div class="row"><button class="btn ghost grow" data-act="skip">Другое слово</button><button class="btn ghost grow" data-act="giveup">Никто не угадал</button></div>`;
    } else {
      b.innerHTML = `<div class="big-wait">${av(g.shower,'lg')}<h2>${g.mode==='gesture'?'Показывает':'Объясняет'} ${esc(nameOf(g.shower))}</h2>${timerHtml(g.deadline,'huge')}
        <p class="muted">Угадывайте вслух. Когда угадаете, ${esc(nameOf(g.shower))} отметит, кто был первым.</p></div>`;
    }
    node.addEventListener('click', e=>{
      const h=e.target.closest('[data-hit]'); if(h){ act('croc-hit',{pid:h.dataset.hit}); return; }
      const a=e.target.closest('[data-act]'); if(!a) return;
      if(a.dataset.act==='skip') act('croc-skip');
      if(a.dataset.act==='giveup') armed(a,'Точно?',()=>act('croc-giveup'));
    });
    const inst={el:node, update(v){ const w=$('#w',node); if(w) w.textContent=v.g.word; }};
    inst.update(v); return inst;
  }
};
const CrocResult = {
  mount(v){
    const g=v.g;
    const head = g.guessedBy ? `${esc(nameOf(g.guessedBy))} угадал(а)!` : ({time:'Время вышло',giveup:'Никто не угадал',skip:'Ход пропущен',away:'Показывающий отключился'}[g.note]||'Никто не угадал');
    const node = el(`<section class="stack" style="gap:18px;--gc:var(--mint)">${gameHead('croc', `<span class="tag">Ход ${g.turn+1} из ${g.total}</span>`)}
      <div class="wordcard"><span class="eyebrow" style="color:#6E6A8A">Было слово</span><div class="w">${esc(g.word||'—')}</div></div>
      <div class="verdict">${head}</div>
      ${g.guessedBy?`<p class="muted" style="text-align:center">+2 очка ${esc(nameOf(g.guessedBy))}, +1 ${esc(nameOf(g.shower))}</p>`:''}
      ${scoreboard(v.players.filter(p=>p.inGame), g.guessedBy?{[g.guessedBy]:2,[g.shower]:1}:null)}
      <div class="sticky-cta">${v.isHost?`<button class="btn mint big" data-act="next">${g.turn+1>=g.total?'К итогам':'Следующий ход'}</button>`:`<div class="waitnote">Следующий ход через пару секунд</div>`}</div></section>`);
    node.addEventListener('click', e=>{ if(e.target.closest('[data-act=next]')) act('croc-next'); });
    return {el:node};
  }
};
const CrocFinal = {
  mount(v){
    const ps=v.players.filter(p=>p.inGame).sort((a,b)=>b.score-a.score);
    const top=ps[0], tie=ps.length>1 && ps[1].score===top.score;
    const node = el(`<section class="stack" style="gap:18px;--gc:var(--mint)">${gameHead('croc','<span class="tag">Итоги</span>')}
      <div class="big-wait" style="padding-block:10px">${top?av(top.pid,'lg'):''}<div class="verdict">${top && top.score>0 ? (tie?'Ничья на первом месте!':esc(top.name)+' побеждает!') : 'Никто не набрал очков'}</div></div>
      ${scoreboard(ps)}
      <div class="sticky-cta">${v.isHost?`<div class="row"><button class="btn ghost grow" data-act="lobby">В лобби</button><button class="btn mint grow" data-act="again">Ещё партия</button></div>`:`<div class="waitnote">Ждём ведущего</div>`}</div></section>`);
    node.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act); });
    return {el:node};
  }
};

/* ---------- Spy ---------- */
function spyCardFace(g){
  const K=spyPack(g);
  if(g.isSpy) return `<div class="face back spy"><div class="loc">Ты шпион</div><p class="role">${K.spyTask}${g.spyCount>1?' Шпионов двое — кто второй, ты не знаешь.':''}</p></div>`;
  return `<div class="face back"><span class="eyebrow" style="color:#6E6A8A">${K.what}</span><div class="loc">${esc(g.loc)}</div>${g.role?`<p class="role">Твоя роль: ${esc(g.role)}</p>`:''}</div>`;
}
function flipCard(g, open){ return `<div class="flip ${open?'open':''}" id="flip"><button class="flip-in" style="display:block;width:100%;padding:0;text-align:center" aria-label="Перевернуть карточку"><div class="face front">Нажми, чтобы посмотреть<br><span class="small" style="font-family:var(--f-body);font-weight:500;color:var(--muted)">Убедись, что никто не подглядывает</span></div>${spyCardFace(g)}</button></div>`; }
const SpyCards = {
  mount(v){
    const node = el(`<section class="stack" style="gap:18px;--gc:var(--yellow)">${gameHead('spy')}<h2>Твоя карточка</h2>${flipCard(v.g,false)}<div id="ctl" class="sticky-cta"></div></section>`);
    node.addEventListener('click', e=>{
      if(e.target.closest('.flip-in')) $('#flip',node).classList.toggle('open');
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='ready'){ $('#flip',node).classList.remove('open'); act('spy-ready'); }
      if(b.dataset.act==='start') act('spy-start');
    });
    const inst={el:node, update(v){
      const g=v.g;
      $('#ctl',node).innerHTML = (g.ready ? `<div class="waitnote">Запомнили: ${g.readyCount} из ${g.total}</div>` : `<button class="btn primary big" data-act="ready">Я запомнил(а)</button>`)
        + (v.isHost && g.readyCount<g.total ? `<button class="btn ghost wide" data-act="start">Начать, не дожидаясь всех</button>`:'');
    }};
    inst.update(v); return inst;
  }
};
function locGrid(g){ const marks=App.spyMarks[g.id]||(App.spyMarks[g.id]={}); const items=spyPack(g).items; return `${items.length>40?`<input class="input" id="locq" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск по списку" style="margin-bottom:10px;min-height:44px">`:''}<div class="locs" id="locs">${items.map(l=>`<button data-loc="${esc(l.n)}" class="${marks[l.n]?'struck':''}">${esc(l.n)}</button>`).join('')}</div>`; }
function bindLocs(node, g){
  let picking=false, sel=null;
  const marks=App.spyMarks[g.id], K=spyPack(g);
  const q=$('#locq',node);
  if(q) q.addEventListener('input', ()=>{ const t=q.value.trim().toLowerCase(); $$('#locs button',node).forEach(b=>{ b.hidden = !!t && !b.dataset.loc.toLowerCase().includes(t); }); });
  node.addEventListener('click', e=>{
    const L=e.target.closest('[data-loc]');
    if(L){
      if(picking){ sel=L.dataset.loc; $$('#locs button',node).forEach(b=>b.classList.toggle('sel', b===L)); const c=$('#guessgo',node); c.hidden=false; c.textContent=K.sel+sel; return; }
      marks[L.dataset.loc]=!marks[L.dataset.loc]; L.classList.toggle('struck'); return;
    }
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='guess'){ picking=!picking; $('#locs',node).classList.toggle('picking',picking); b.textContent = picking?'Отмена':K.know; $('#pickhint',node).hidden=!picking; if(!picking){ sel=null; $('#guessgo',node).hidden=true; $$('#locs button',node).forEach(x=>x.classList.remove('sel')); } }
    if(b.dataset.act==='guessgo' && sel) armed(b, 'Точно «'+sel+'»? Второго шанса нет', ()=>act('spy-guess',{loc:sel}));
  });
}
function spyGuessBlock(g){ return g.isSpy ? `<div class="stack" style="gap:8px"><button class="btn primary wide" data-act="guess">${spyPack(g).know}</button><p class="small muted" id="pickhint" hidden>${spyPack(g).pickHint}</p><button class="btn pink wide" id="guessgo" data-act="guessgo" hidden></button></div>` : ''; }
const SpyTalk = {
  mount(v){
    const g=v.g;
    const node = el(`<section class="stack" style="gap:16px;--gc:var(--yellow)">${gameHead('spy')}
      <div class="big-wait" style="padding-block:6px">${timerHtml(g.deadline,'huge')}<p class="muted">${g.tie?'Голоса разделились — продолжаем допрос.':spyPack(g).ask}</p></div>
      <div class="card row" style="gap:12px">${av(g.first)}<div class="grow"><div class="small muted">Первым спрашивает</div><b>${esc(nameOf(g.first))}</b></div></div>
      ${flipCard(g,false)}
      ${spyGuessBlock(g)}
      <button class="btn ghost wide" data-act="vote">Начать голосование</button>
      <details class="card"><summary>${spyPack(g).all}</summary><p class="small muted" style="margin-bottom:10px">Нажимайте, чтобы вычёркивать — это видно только вам.</p>${locGrid(g)}</details>
    </section>`);
    if(g.isSpy) $('details',node).open=true;
    node.addEventListener('click', e=>{
      if(e.target.closest('.flip-in')) $('#flip',node).classList.toggle('open');
      const b=e.target.closest('[data-act=vote]'); if(b) armed(b,'Точно начать голосование?',()=>act('spy-callvote'));
    });
    bindLocs(node, g);
    return {el:node};
  }
};
const SpyVote = {
  mount(v){
    const g=v.g;
    const node = el(`<section class="stack" style="gap:16px;--gc:var(--yellow)">${gameHead('spy')}
      <h2>${g.voteFinal?'Время вышло. Кто шпион?':'Голосование: кто шпион?'}</h2>
      <p class="muted">${g.voteFinal?'Последнее голосование.':esc(nameOf(g.caller))+' начал(а) голосование.'} Голоса откроются, когда проголосуют все.</p>
      <div class="hits" id="hits"></div><p id="st" style="font-weight:700"></p><div id="extra" class="stack"></div>
      ${g.isSpy?`${spyGuessBlock(g)}<details class="card" open><summary>${spyPack(g).all}</summary>${locGrid(g)}</details>`:''}
    </section>`);
    node.addEventListener('click', e=>{
      const h=e.target.closest('[data-vote]'); if(h){ act('spy-vote',{target:h.dataset.vote}); return; }
      const b=e.target.closest('[data-act=cancel]'); if(b) act('spy-cancelvote');
    });
    if(g.isSpy) bindLocs(node, g);
    const inst={el:node, update(v){
      const g=v.g;
      $('#hits',node).innerHTML = g.order.filter(p=>p!==v.me).map(p=>`<button class="hit" data-vote="${esc(p)}" style="${g.myVote===p?'background:var(--yellow);color:var(--ink);border-color:var(--yellow)':''}">${av(p,'sm')}<span>${esc(nameOf(p))}</span></button>`).join('');
      $('#st',node).textContent = (g.myVote?'Ваш голос: '+nameOf(g.myVote)+'. ':'')+'Проголосовали '+g.voted+' из '+g.total;
      $('#extra',node).innerHTML = (!g.voteFinal && (v.me===g.caller || v.isHost)) ? `<button class="btn ghost wide" data-act="cancel">Отменить голосование</button>` : '';
    }};
    inst.update(v); return inst;
  }
};
const SpyResult = {
  mount(v){
    const g=v.g, r=g.result;
    const spyNames = g.spies.map(nameOf).join(' и ');
    const why = {
      caught: `Шпиона вычислили: ${esc(nameOf(r.accused))}.`,
      wrong: `Под подозрение попал(а) ${esc(nameOf(r.accused))}, но это был мирный житель.`,
      tie: 'Голоса разделились — шпион остался незамеченным.',
      guessed: `${esc(nameOf(r.guesser))} ${spyPack(g).guessed}.`,
      missed: `${esc(nameOf(r.guesser))} назвал(а) «${esc(r.guess)}» — мимо.`
    }[r.reason];
    const node = el(`<section class="stack" style="gap:18px;--gc:var(--yellow)">${gameHead('spy')}
      <div class="banner ${r.win}"><div class="verdict">${r.win==='civ'?'Мирные победили':(g.spies.length>1?'Шпионы победили':'Шпион победил')}</div><p>${why}</p></div>
      <div class="card stack" style="gap:10px">
        <div class="row"><span class="muted grow">${spyPack(g).what}</span><b>${esc(g.loc)}</b></div>
        <div class="row"><span class="muted grow">${g.spies.length>1?'Шпионы':'Шпион'}</span><span class="row" style="gap:6px">${g.spies.map(p=>av(p,'sm')).join('')}<b>${esc(spyNames)}</b></span></div>
      </div>
      <div class="sticky-cta">${v.isHost?`<div class="row"><button class="btn ghost grow" data-act="lobby">В лобби</button><button class="btn primary grow" data-act="again">Новый раунд</button></div>`:`<div class="waitnote">Ждём ведущего</div>`}</div></section>`);
    node.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act); });
    return {el:node};
  }
};

/* =====================================================================
   Boot
   ===================================================================== */
window.addEventListener('beforeunload', ()=>{ if(App.role==='host' && Host.S) store.set('balagan-host', {S:Host.S, t:Date.now()}); });
window.addEventListener('hashchange', ()=>{ if(!App.role) showLanding(); });
(function boot(){
  const code = normCode(location.hash.slice(1));
  const hs = store.get('balagan-host', null);
  if(code.length===4 && hs && hs.S && hs.S.code===code && Date.now()-hs.t < 12*3600e3 && (ss('balagan-host-tab')===code || !hostAliveElsewhere(code))){
    App.me = App.me || {name:nameFromHost(hs.S), color:AV_COLORS[0]}; Host.resume(hs.S); return;
  }
  const last = store.get('balagan-last', null);
  if(code.length===4 && App.me && last && last.code===code && Date.now()-last.t < 6*3600e3){ Client.join(code); return; }
  showLanding();
})();
</script>

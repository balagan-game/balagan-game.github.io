<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16143A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Сломанный телефон, Крокодил и Шпион — играйте компанией, каждый со своего телефона.">
<title>Балаган</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Room code and the current task at the top, the main action low, where the thumb is. */
:root{
  --ink:#16143A; --ink-2:#201D4E; --ink-3:#2C2865; --ink-4:#3A3580;
  --paper:#F4F1FF; --muted:#A9A4D6; --dim:#7C77AE; --line:rgba(244,241,255,.13);
  --pink:#FF4F9A; --orange:#FF8A3D; --yellow:#FFD23F; --mint:#3DDBB0; --sky:#7AA7FF; --danger:#FF6B5E;
  --sheet:#FFFDF8; --sheet-ink:#1B1A2E;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-s:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100dvh;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  background-image:radial-gradient(rgba(244,241,255,.045) 1px,transparent 1.2px);background-size:22px 22px}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:620px;margin:0 auto;padding-block:6px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(22px,6vw,28px);line-height:1.15}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 160px;min-width:0}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:16px;
  background:var(--ink-3);color:var(--paper);border:1.5px solid var(--line);transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--yellow);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 #B8901A}
.btn.primary:active{box-shadow:0 1px 0 #B8901A;transform:translateY(3px)}
.btn.pink{background:var(--pink);color:#fff;border-color:transparent;box-shadow:0 4px 0 #B42A67}
.btn.mint{background:var(--mint);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 #1F9C7A}
.btn.ghost{background:transparent}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.btn.armed{background:var(--danger);color:#fff;border-color:transparent;box-shadow:none}
.link{color:var(--sky);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;font-weight:600}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.input,textarea.input{width:100%;min-height:52px;padding:12px 16px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--ink-2);color:var(--paper);font-size:17px}
textarea.input{resize:none;line-height:1.4}
.input::placeholder{color:var(--dim)}
.input:focus{border-color:var(--sky);outline:none}
.code-input{font-family:var(--f-display);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:22px;font-weight:700}

.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.err{color:var(--danger);font-weight:600;font-size:15px;min-height:1px}

/* ---------- top bar ---------- */
#bar{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line);font-weight:700;font-size:14px;min-height:40px}
.chip .code{font-family:var(--f-display);letter-spacing:.14em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(61,219,176,.18)}
.dot.off{background:var(--danger);box-shadow:0 0 0 3px rgba(255,107,94,.2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.bar-btn{padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;min-height:40px}
.bar-btn.armed{background:var(--danger);color:#fff}
#netwarn{max-width:620px;margin:6px auto 0;padding:10px 14px;border-radius:var(--r-s);background:rgba(255,107,94,.14);color:#FFC2BB;font-size:14px;font-weight:600}

/* ---------- landing ---------- */
.hero{padding-block:28px 6px;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,17vw,96px);line-height:.9;letter-spacing:-.04em;position:relative;display:inline-block;width:max-content;max-width:100%}
.logo span{position:relative;color:var(--paper)}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.logo::before{color:var(--pink);transform:translate(-4px,3px)}
.logo::after{color:var(--mint);transform:translate(4px,-2px);opacity:.85}
.logo span{z-index:1}
@media (prefers-reduced-motion:no-preference){.logo::before{animation:jitter 3.2s ease-in-out infinite}.logo::after{animation:jitter 3.2s ease-in-out infinite reverse}}
@keyframes jitter{0%,100%{translate:0 0}50%{translate:1.5px -1px}}
.tagline{font-size:18px;color:var(--muted);max-width:30ch}
.swatches-av{display:flex;gap:8px;flex-wrap:wrap}
.swatch-av{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatch-av[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.resume{display:flex;align-items:center;gap:12px;justify-content:space-between;border-color:rgba(255,210,63,.35);background:rgba(255,210,63,.08)}
.games-strip{display:grid;gap:12px}
.gcard{position:relative;border-radius:var(--r);padding:18px 18px 18px 22px;background:var(--ink-2);border:1px solid var(--line);overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:6px}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc)}
.gcard h3{color:var(--gc)}
.gcard .meta{font-size:13px;color:var(--dim);font-weight:600}
.how{display:grid;gap:10px;counter-reset:how}
.how li{list-style:none;display:flex;gap:12px;align-items:flex-start;color:var(--muted)}
.how li::before{counter-increment:how;content:counter(how);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink-3);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.how{padding:0;margin:0}

/* ---------- avatars & players ---------- */
.av{--c:var(--sky);flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--ink);display:inline-grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:15px;text-transform:uppercase}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:26px}
.av.off{filter:grayscale(1) brightness(.6)}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);min-height:52px}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ink-3);color:var(--muted);white-space:nowrap}
.tag.host{background:rgba(255,210,63,.16);color:var(--yellow)}
.tag.me{background:rgba(122,167,255,.16);color:var(--sky)}
.tag.off{background:rgba(255,107,94,.14);color:#FFA79E}
.x{width:36px;height:36px;border-radius:50%;color:var(--dim);font-size:20px;line-height:1}
.x.armed{background:var(--danger);color:#fff;width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700}
.avrow{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- lobby ---------- */
.roomcode{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.roomcode .big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,14vw,64px);letter-spacing:.08em;line-height:1}
.qr{background:#fff;border-radius:12px;padding:6px;width:118px;height:118px;flex:none}
.qr svg,.qr img{width:100%;height:100%;display:block}
.seats{display:flex;align-items:center;gap:10px}
.step-btn{width:44px;height:44px;border-radius:50%;background:var(--ink-3);border:1px solid var(--line);font-size:22px;font-weight:700}
.step-btn[disabled]{opacity:.35}
.seats .n{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.gpick{display:grid;gap:10px}
.gpick .gcard{cursor:pointer;border-width:2px}
.gpick .gcard[aria-pressed="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 12%,var(--ink-2))}
.gpick .gcard[aria-pressed="true"]::after{content:"Выбрано";position:absolute;right:14px;top:14px;font-size:12px;font-weight:700;color:var(--ink);background:var(--gc);padding:3px 9px;border-radius:999px}
.gpick.locked .gcard{cursor:default}
.gpick.locked .gcard[aria-pressed="false"]{display:none}
.opt{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 14px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.seg.ro button{pointer-events:none}
.seg.ro button[aria-pressed="false"]{display:none}
.rules{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:6px}
.sticky-cta{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.sticky-cta::before{content:"";position:absolute;inset:-18px -16px -30px;background:linear-gradient(to bottom,transparent,var(--ink) 40%);z-index:-1}
.waitnote{text-align:center;color:var(--muted);font-weight:600;padding:14px;border-radius:var(--r);border:1.5px dashed var(--line)}

/* ---------- task / game common ---------- */
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gname{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gc,var(--muted))}
.timer{font-family:var(--f-display);font-weight:700;font-size:18px;padding:6px 14px;border-radius:999px;background:var(--ink-3);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center}
.timer.low{background:var(--pink);color:#fff}
@media (prefers-reduced-motion:no-preference){.timer.low{animation:pulse 1s infinite}}
@keyframes pulse{50%{transform:scale(1.06)}}
.timer.huge{font-size:clamp(48px,16vw,80px);padding:10px 26px;border-radius:28px}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6.4vw,30px);line-height:1.2;text-wrap:balance}
.quote{background:var(--sheet);color:var(--sheet-ink);border-radius:var(--r);padding:18px 20px 18px 46px;font-weight:600;font-size:20px;line-height:1.3;position:relative}
.quote::before{content:"«";font-family:var(--f-display);position:absolute;left:14px;top:8px;font-size:34px;line-height:1;color:var(--pink)}
.big-wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:30px}
.progress{width:100%;height:10px;border-radius:999px;background:var(--ink-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gc,var(--yellow));border-radius:inherit;transition:width .3s}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--ink-3);border-top-color:var(--yellow);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- drawing pad ---------- */
.pad{display:flex;flex-direction:column;gap:10px}
.paper{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--sheet);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.25)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{display:flex;flex-direction:column;gap:8px}
.colors{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:29px;height:29px;border-radius:50%;background:var(--c);border:3px solid var(--ink-2);box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper)}
.toolrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{min-height:40px;min-width:40px;padding:6px 12px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.tool.armed{background:var(--danger);color:#fff}
.tool .d{display:block;border-radius:50%;background:currentColor}

/* ---------- telephone album ---------- */
.album{display:flex;flex-direction:column;gap:14px}
.aitem{display:flex;flex-direction:column;gap:8px}
.aitem .who{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:14px}
.aitem.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:.2}}
@media (prefers-reduced-motion:reduce){.aitem.new{animation:none}}
.empty-note{color:var(--sheet-ink);opacity:.5;font-style:italic}
.chain-sep{height:1px;background:var(--line);margin-block:10px}

/* ---------- crocodile ---------- */
.wordcard{background:var(--sheet);color:var(--sheet-ink);border-radius:22px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.wordcard .w{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,46px);line-height:1.05;text-wrap:balance;word-break:break-word}
.wordcard .hint{font-size:15px;color:#5D5A75;font-weight:500;max-width:32ch}
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-radius:var(--r);background:var(--sheet);color:var(--sheet-ink);font-family:var(--f-display);font-weight:700;font-size:20px;text-align:left}
.choice small{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6E6A8A;flex:none}
.blanks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.blanks .wd{display:flex;gap:4px}
.blanks .wd i{width:16px;height:4px;border-radius:2px;background:var(--paper);display:block;margin-top:14px}
.feed{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding:2px}
.fmsg{display:flex;gap:8px;align-items:center;font-size:15px;min-width:0}
.fmsg b{font-weight:700;flex:none}
.fmsg span{min-width:0;overflow-wrap:anywhere}
.fmsg.ok{color:var(--mint);font-weight:700}
.guessbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;z-index:5;background:var(--ink);padding-top:6px}
.guessbar .input{flex:1;min-width:0}
.hits{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.hit{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-s);background:var(--ink-3);border:1px solid var(--line);font-weight:600;min-height:52px;text-align:left;min-width:0}
.hit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .pl{font-family:var(--f-display);font-weight:700;width:2ch;color:var(--dim);font-variant-numeric:tabular-nums}
.srow .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pts{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.srow.first .pl{color:var(--yellow)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.1;text-align:center;text-wrap:balance}

/* ---------- spy ---------- */
.flip{perspective:1200px}
.flip-in{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.face.front{background:repeating-linear-gradient(45deg,var(--ink-3) 0 14px,var(--ink-4) 14px 28px);border:2px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:20px}
.face.back{background:var(--sheet);color:var(--sheet-ink);transform:rotateY(180deg)}
.face.back.spy{background:var(--yellow)}
.face .loc{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1.1;text-wrap:balance}
.face .role{font-weight:600;font-size:17px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.locs button{padding:10px 12px;border-radius:var(--r-s);background:var(--ink-3);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:left;min-height:44px}
.locs button.struck{opacity:.35;text-decoration:line-through}
.locs.picking button{border-color:var(--yellow)}
.locs button.sel{background:var(--yellow);color:var(--ink);opacity:1;text-decoration:none}
.banner{border-radius:24px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.banner.civ{background:var(--mint);color:var(--ink)}
.banner.spy{background:var(--yellow);color:var(--ink)}
.banner p{font-weight:600;font-size:17px;max-width:34ch}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"+";font-size:22px;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:12px}

/* ---------- meme ---------- */
.pubbtn{background:var(--sky);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 #3F68B8;flex-direction:column;gap:0;line-height:1.2}
.pubbtn small{font-weight:600;font-size:13px;opacity:.8}
.meme{margin:0;background:#fff;color:#111;border-radius:var(--r);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.meme figcaption{padding:14px 16px 12px;font-family:var(--f-body);font-weight:600;font-size:clamp(17px,4.8vw,21px);line-height:1.28;overflow-wrap:anywhere;white-space:pre-wrap}
.meme figcaption.ph{color:#9A97A8;font-weight:500}
.meme .pic{display:block;width:100%;height:auto;max-height:58vh;object-fit:contain;background:#0E0D20}
.meme .nopic{display:grid;place-items:center;aspect-ratio:4/3;background:#0E0D20;color:var(--muted);font-size:14px;padding:16px;text-align:center}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vote{min-height:64px;border-radius:var(--r);font-weight:800;font-size:16px;color:var(--ink);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vote.bad{background:var(--danger)} .vote.mid{background:var(--sky)} .vote.good{background:var(--mint)}
.vote[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 3px var(--ink) inset}
.votes.locked .vote[aria-pressed="false"]{opacity:.35}
.vote .n{font-family:var(--f-display);font-size:22px}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:#0E0D20}
.mrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .tx b{font-weight:600;overflow-wrap:anywhere}
.mrow .tx span{font-size:13px;color:var(--muted)}
.tally{display:flex;gap:6px;flex:none;font-size:13px;font-weight:700}
.tally i{font-style:normal;padding:3px 8px;border-radius:999px;color:var(--ink)}
.fcard{background:var(--sheet);color:var(--sheet-ink);border-radius:var(--r);padding:20px 20px 22px;font-size:clamp(18px,5vw,22px);line-height:1.42;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow-wrap:anywhere}
.fcard .pre{color:#47445C;font-weight:500}
.fcard .cap{font-weight:800;color:#D9481B}
.fcard .cap.ph{color:#A8A4BC;font-weight:500}
.mrow .tx .pre{color:var(--muted);font-weight:500}

function makeLink(url, {clientId, will, onMessage, onState}){
  const parts = new Map();
  const m = new Mqtt(url, {clientId, will, onState, onMessage:(topic,msg)=>{

      if(e.got===e.n){ parts.delete(msg._k); let full; try{ full=JSON.parse(e.s.join('')); }catch(err){ return; } onMessage(topic, full); }

      return;
    }
    onMessage(topic, msg);
  }});
  return {
    get ok(){ return m.ok; },
    connect(){ m.connect(); }, subscribe(t){ m.subscribe(t); }, close(){ m.close(); },
    send(topic, obj){
      const txt = JSON.stringify(obj);
      if(txt.length<=CHUNK) return m.publish(topic, txt);
      const k=uid(), n=Math.ceil(txt.length/CHUNK); let ok=true;
      for(let i=0;i<n;i++) ok = m.publish(topic, JSON.stringify({_k:k, i, n, s:txt.slice(i*CHUNK,(i+1)*CHUNK)})) && ok;

    }
  };

  if(!pid){ const lp=store.get('balagan-pid-'+code,null); const cl=lp && store.get('balagan-claim-'+lp,null); if(lp && (!cl || cl.tab===TAB || Date.now()-cl.t>8000)) pid=lp; }
  if(!pid) pid=uid();
  ss('balagan-pid-'+code, pid); store.set('balagan-claim-'+pid, {tab:TAB, t:Date.now()});
  return pid;
}
function hostAliveElsewhere(code){ const a=store.get('balagan-host-alive',null); return !!(a && a.code===code && a.tab!==TAB && Date.now()-a.t<7000); }
setInterval(()=>{
  if(App.role==='client' && App.pid) store.set('balagan-claim-'+App.pid, {tab:TAB, t:Date.now()});
  if(App.role==='host' && App.code) store.set('balagan-host-alive', {code:App.code, tab:TAB, t:Date.now()});
}, 2000);
let toastTimer=null;
function toast(text){ const t=$('#toast'); t.textContent=text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }
/* two-tap confirmation built into the button itself */
function armed(btn, label, fn){
  if(btn.classList.contains('armed')){ btn.classList.remove('armed'); clearTimeout(btn._armT); btn.textContent=btn._orig; fn(); return; }
  btn._orig = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
  btn._armT = setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent=btn._orig; }, 3500);
}
function roomLink(code){ return location.href.split('#')[0] + '#' + code; }
const IS_FILE = location.protocol==='file:';
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Ссылка скопирована'); }
  catch(e){ const i=el(`<input class="input" readonly>`); i.value=text; document.body.appendChild(i); i.select(); try{ document.execCommand('copy'); toast('Ссылка скопирована'); }catch(_){ toast(text); } i.remove(); }
}
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }catch(e){} }

/* =====================================================================
   App state
   ===================================================================== */
const App = {
  role:null, code:null, pid:null, view:null, offset:0,
  me: store.get('balagan-me', null),
  album:null, taskCache:{}, live:{turn:-1, strokes:[]}, spyMarks:{}
};
const serverNow = () => Date.now() + App.offset;

function act(a, data){
  const m = Object.assign({a}, data||{});
  if(App.role==='host') { Host.act(App.pid, m); return true; }
  if(App.role==='client') return Client.send(m);
  return false;
}
function setNet(ok){ App.netOk = ok; const w=$('#netwarn'); if(w) w.hidden = ok || !App.role; const d=$('#bar .dot'); if(d) d.classList.toggle('off', !ok); }

function onMessage(m){
  if(!m || typeof m!=='object') return;
  switch(m.t){
    case 'welcome':
      App.pid = m.pid; store.set('balagan-pid-'+App.code, m.pid); ss('balagan-pid-'+App.code, m.pid);
      store.set('balagan-last', {code:App.code, t:Date.now()});
      setNet(true); break;
    case 'state':
      App.offset = (m.v.now||Date.now()) - Date.now();
      App.view = m.v; render(); break;
    case 'album':
      App.album = m; render(); break;
    case 'stroke': case 'undo': case 'clear': case 'strokes':
      liveStroke(m); break;
    case 'toast': toast(m.text); break;
    case 'reject':
      leaveRoom(m.reason==='full' ? 'Комната заполнена — попросите ведущего добавить мест.' : m.reason==='kicked' ? 'Ведущий удалил вас из комнаты.' : m.reason==='closed' ? 'Ведущий закрыл комнату.' : 'Не получилось войти.');
      break;
    case 'ping': break;
  }
}
function liveStroke(m){
  const L = App.live;
  if(m.turn!==L.turn){ L.turn=m.turn; L.strokes=[]; }
  if(m.t==='stroke') L.strokes.push(m.s);
  else if(m.t==='undo') L.strokes = L.strokes.filter(s=>s.i!==m.i);
  else if(m.t==='clear') L.strokes = [];
  else if(m.t==='strokes') L.strokes = (m.all||[]).slice();
  cur.inst?.onLive?.(m);
}

/* =====================================================================
   HOST — authoritative game state, lives in the host's browser
   ===================================================================== */
const Host = {
  S:null, links:[], vconns:new Map(), conns:new Map(), sentTask:{}, pending:false, lastPing:0, saveT:null, tickT:null,
  create(me){
    const code = makeCode(), pid = uid();
    const S = { code, hostPid:pid, phase:'lobby', g:null, spyRecent:[],
      players:[{pid, name:me.name, color:me.color, connected:true, score:0, lastSeen:Date.now()}],
      settings:DEFAULT_SETTINGS() };
    this.start(S, true);
  },
  /* open room: whoever is there first hosts it; the job moves on when they leave */
  createPublic(me, pid, carry){
    const players=[{pid, name:me.name, color:me.color, connected:true, score:0, mid:0, lastSeen:Date.now()}];
    (carry||[]).forEach(p=>{ if(p.pid!==pid && players.length<16) players.push({pid:p.pid, name:cleanName(p.name), color:cleanColor(p.color), connected:false, score:0, mid:0, lastSeen:Date.now()}); });
    const st=DEFAULT_SETTINGS(); st.game='meme'; st.maxPlayers=16;
    const S = { code:PUBLIC_CODE, public:true, hostPid:pid, phase:'lobby', g:null, spyRecent:[], players, settings:st, autoAt:null };
    this.start(S, true);
  },
  resume(S){
    const D=DEFAULT_SETTINGS(); for(const k of ['telephone','croc','meme','finish','spy']) S.settings[k]=Object.assign(D[k], S.settings[k]);
    S.players.forEach(p=>{ if(p.pid!==S.hostPid) p.connected=false; p.lastSeen=Date.now(); });
    this.start(S, false);
  },
  start(S, fresh){
    this.S = S; App.role='host'; App.pid=S.hostPid; App.code=S.code;
    if(location.hash.slice(1)!==S.code) history.replaceState(null,'','#'+S.code);
    if(!S.public){ ss('balagan-host-tab', S.code); store.set('balagan-host-alive', {code:S.code, tab:TAB, t:Date.now()}); }
    this.hid=uid(); this.since=Date.now(); this.lastAnn=0;
    this.open();
    clearInterval(this.tickT); this.tickT=setInterval(()=>this.tick(), 500);
    this.changed();
  },
  open(){
    const base=NS+this.S.code;
    (this.links||[]).forEach(l=>{ try{ l.close(); }catch(e){} });
    this.vconns = new Map();
    this.links = BROKERS.map((url,bi)=>{
      const L = makeLink(url, {clientId:'bh'+uid(), onState:()=>this.netState(), onMessage:(t,msg)=> t.endsWith('/a') ? this.onAnnounce(msg) : this.onNet(bi,msg)});
      L.subscribe(base+'/h'); if(this.S.public) L.subscribe(base+'/a'); L.connect(); return L;
    });
    setTimeout(()=>this.netState(), 9000);
  },
  netState(){ setNet(!!this.links && this.links.some(l=>l.ok)); },
  onNet(bi, msg){
    if(!this.S || !msg || typeof msg.c!=='string' || msg.c.length>40) return;
    let c=this.vconns.get(msg.c);
    if(msg.bye){ if(c) c._close(); return; }
    if(!msg.d || typeof msg.d!=='object') return;
    if(!c){
      if(msg.d.t!=='hello'){ this.links[bi].send(NS+this.S.code+'/p/'+msg.c, {t:'rehello'}); return; }
      c = new VConn(this, bi, msg.c); this.vconns.set(msg.c, c); this.onConn(c);
    }
    c.bi = bi; c._emit('data', msg.d);
  },
  close(note){
    const pub = this.S && this.S.public;
    for(const [pid] of this.conns) this.send(pid, pub ? {t: note||'hostleft'} : {t:'reject', reason:'closed'});
    clearInterval(this.tickT);
    const links=this.links; this.links=[];
    setTimeout(()=>{ (links||[]).forEach(l=>{ try{ l.close(); }catch(e){} }); }, 600);
    if(!pub){ store.del('balagan-host'); store.del('balagan-host-alive'); ss('balagan-host-tab', null); }
    this.S=null; this.conns.clear();
  },
  onAnnounce(m){
    if(!this.S || !this.S.public || !m || m.hid===this.hid || typeof m.since!=='number') return;
    if(m.since < this.since || (m.since===this.since && String(m.hid) < this.hid)) this.yieldRoom();
  },
  /* two people opened the open room at once: the younger host steps down and joins the older one */
  yieldRoom(){
    const me=App.me, pid=App.pid;
    this.close('rehost'); App.role=null;
    Client.join(PUBLIC_CODE, pid);
  },
  player(pid){ return this.S.players.find(p=>p.pid===pid); },
  onConn(conn){
    conn.on('data', m => this.onMsg(conn, m));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && this.conns.get(pid)===conn){ this.conns.delete(pid); const p=this.player(pid); if(p){ p.connected=false; this.changed(); } }
    });
    conn.on('error', ()=>{});
  },
  onMsg(conn, m){
    if(!m || typeof m!=='object' || !this.S) return;
    const S=this.S;
    if(m.t==='hello'){
      let p = (typeof m.pid==='string' && m.pid!==S.hostPid) ? this.player(m.pid) : null;
      if(!p){
        if(S.players.length >= S.settings.maxPlayers){ try{ conn.send({t:'reject', reason:'full'}); }catch(e){} setTimeout(()=>{ try{conn.close()}catch(e){} }, 800); return; }
        const pid = (typeof m.pid==='string' && /^[a-z0-9]{6,20}$/.test(m.pid) && m.pid!==S.hostPid) ? m.pid : uid();
        p = {pid, name:cleanName(m.name), color:cleanColor(m.color), connected:true, score:0, lastSeen:Date.now()};
        S.players.push(p);
        if(S.phase!=='lobby') this.broadcastToast(p.name+' зашёл — сыграет в следующей игре');
      }
      p.name = cleanName(m.name); p.color = cleanColor(m.color); p.left=false;
      const old = this.conns.get(p.pid); if(old && old!==conn){ old._pid=null; try{ old.close(); }catch(e){} }
      conn._pid = p.pid; this.conns.set(p.pid, conn); p.connected=true; p.lastSeen=Date.now();
      delete this.sentTask[p.pid];
      this.send(p.pid, {t:'welcome', pid:p.pid});
      this.resyncExtras(p.pid);
      this.changed();
      return;
    }
    const pid = conn._pid; if(!pid) return;
    const p = this.player(pid);
    if(!p){ try{ conn.send({t:'reject', reason:'kicked'}); }catch(e){} return; }
    p.lastSeen = Date.now();
    if(!p.connected){ p.connected=true; this.changed(); }
    if(m.t==='act' && typeof m.a==='string') this.act(pid, m);
  },
  resyncExtras(pid){
    const g=this.S.g; if(!g) return;
    if(g.type==='telephone' && g.stage!=='play') this.sendAlbum(pid);
    if(g.type==='croc') this.send(pid, {t:'strokes', turn:g.turn, all:g.strokes});
  },
  send(pid, msg){
    if(pid===this.S?.hostPid){ onMessage(msg); return; }
    const c=this.conns.get(pid);
    if(c && c.open){ try{ c.send(msg); }catch(e){} }
  },
  relay(msg, except){ for(const p of this.S.players) if(p.pid!==except) this.send(p.pid, msg); },
  broadcastToast(text){ for(const p of this.S.players) if(p.pid!==this.S.hostPid) this.send(p.pid, {t:'toast', text}); },
  sendAlbum(pid){
    const g=this.S.g; const msg={t:'album', id:g.id, chains:g.chains};
    if(pid) this.send(pid, msg); else this.relay(msg);
  },
  changed(){
    if(this.pending) return; this.pending=true;
    setTimeout(()=>{ this.pending=false; if(!this.S) return; this.broadcast(); this.persist(); }, 0);
  },
  persist(){
    if(this.saveT || this.S.public) return;
    this.saveT = setTimeout(()=>{ this.saveT=null; if(this.S) store.set('balagan-host', {S:this.S, t:Date.now()}); }, 800);
  },
  broadcast(){
    for(const p of this.S.players){
      if(p.pid!==this.S.hostPid && !this.conns.get(p.pid)?.open) continue;
      const v = this.viewFor(p.pid);
      const task = v.g && v.g.task;
      if(task && task.promptType==='draw'){
        if(this.sentTask[p.pid]===task.key){ delete task.prompt; task.cached=true; }
        else this.sentTask[p.pid]=task.key;
      }
      this.send(p.pid, {t:'state', v});
    }
  },
  viewFor(pid){
    const S=this.S, g=S.g;
    const v = { now:Date.now(), code:S.code, me:pid, hostPid:S.hostPid, isHost:pid===S.hostPid, phase:S.phase, settings:S.settings,
      players:S.players.map(p=>({pid:p.pid, name:p.name, color:p.color, on:p.connected, score:p.score, mid:p.mid||0, inGame: g ? g.order.includes(p.pid) : false})), g:null,
      public:!!S.public, autoAt:S.autoAt||null };
    if(g) v.g = IMPL[g.type].view(this, pid);
    return v;
  },
  tick(){
    if(!this.S) return;
    const now=Date.now();
    if(now-this.lastPing>3000){ this.lastPing=now; for(const [,c] of this.conns) if(c.open){ try{ c.send({t:'ping'}); }catch(e){} } }
    for(const p of this.S.players){
      if(p.pid===this.S.hostPid) continue;
      if(p.connected && now-p.lastSeen>12000){ p.connected=false; this.changed(); }
    }
    if(this.S.public) this.publicTick(now);
    if(this.S && this.S.g) IMPL[this.S.g.type].tick(this, now);
  },
  publicTick(now){
    const S=this.S;
    if(now-this.lastAnn>3000){ this.lastAnn=now; this.links.forEach(l=>{ if(l.ok) l.send(NS+S.code+'/a', {hid:this.hid, since:this.since}); }); }
    const live=S.players.filter(p=>p.connected).length;
    if(S.phase==='lobby'){
      if(live>=GAMES.meme.min){ if(!S.autoAt){ S.autoAt=now+15000; this.changed(); } else if(now>S.autoAt){ S.autoAt=null; S.players=S.players.filter(p=>!p.left); this.startGame(); this.changed(); } }
      else if(S.autoAt){ S.autoAt=null; this.changed(); }
    } else if(live<2){ S.phase='lobby'; S.g=null; S.autoAt=null; this.changed(); }
  },
  removePlayer(pid, kicked){
    const S=this.S; const i=S.players.findIndex(p=>p.pid===pid); if(i<0 || pid===S.hostPid) return;
    if(kicked) this.send(pid, {t:'reject', reason:'kicked'});
    const c=this.conns.get(pid); this.conns.delete(pid);
    if(c){ c._pid=null; setTimeout(()=>{ try{ c.close(); }catch(e){} }, 500); }
    if(S.phase==='lobby' || !S.g || !S.g.order.includes(pid)) S.players.splice(i,1);
    else { S.players[i].connected=false; S.players[i].left=true; }
    this.changed();
  },
  startGame(){
    const S=this.S; const G=GAMES[S.settings.game];
    const n=S.players.filter(p=>p.connected).length;
    if(n<G.min){ toast('Для игры «'+G.name+'» нужно минимум '+G.min+' '+plural(G.min,'игрок','игрока','игроков')); return; }
    S.phase='game'; this.sentTask={}; App.album=null;
    IMPL[S.settings.game].start(this);
  },
  act(pid, m){
    const S=this.S; if(!S) return;
    const isHost = pid===S.hostPid && !S.public;
    if(m.a==='resync'){ delete this.sentTask[pid]; this.resyncExtras(pid); this.changed(); return; }
    if(m.a==='leave'){ this.removePlayer(pid, false); return; }
    if(S.public && S.players.length>16) return;
    if(S.phase==='lobby'){
      if(!isHost) return;
      if(m.a==='game' && GAMES[m.game]) S.settings.game=m.game;
      else if(m.a==='set'){ const d=(SETTINGS[m.game]||[]).find(x=>x.key===m.key); if(d && d.opts.some(o=>o[0]===m.val)) S.settings[m.game][m.key]=m.val; else return; }
      else if(m.a==='seats') S.settings.maxPlayers = clamp(m.val|0, Math.max(2, S.players.length), MAX_SEATS);
      else if(m.a==='kick'){ this.removePlayer(m.pid, true); return; }
      else if(m.a==='start') this.startGame();
      else return;
      this.changed(); return;
    }
    if(isHost && m.a==='lobby'){ S.phase='lobby'; S.g=null; S.players=S.players.filter(p=>!p.left); this.changed(); return; }
    if(isHost && m.a==='again'){ S.players=S.players.filter(p=>!p.left); this.startGame(); this.changed(); return; }
    if(isHost && m.a==='kick'){ this.removePlayer(m.pid, true); return; }
    if(S.g) IMPL[S.g.type].act(this, pid, m);
  }
};
const secs = s => s ? Date.now()+s*1000 : null;
const connectedOrder = H => shuffle(H.S.players.filter(p=>p.connected).map(p=>p.pid));

/* ---------- Сломанный телефон ---------- */
const Tel = {
  start(H){
    const S=H.S, st=S.settings.telephone, order=connectedOrder(H), N=order.length;
    S.g = {type:'telephone', id:uid(), order, steps: st.len ? Math.min(st.len, N) : N, step:0,
      chains: order.map(()=>[]), stage:'play', deadline:secs(st.textTime), reveal:{c:0,i:0}};
  },
  type: k => k%2===0 ? 'text' : 'draw',
  chainOf(g,pid,k){ const i=g.order.indexOf(pid); if(i<0) return -1; const N=g.order.length; return ((i-k)%N+N)%N; },
  authorOf(g,c,k){ return g.order[(c+k)%g.order.length]; },
  fill(g){ const t=this.type(g.step); g.chains.forEach((ch,c)=>{ if(!ch[g.step]) ch[g.step]={type:t, by:this.authorOf(g,c,g.step), data:t==='text'?'':[], miss:true}; }); },
  advance(H){
    const g=H.S.g, st=H.S.settings.telephone;
    g.step++;
    if(g.step>=g.steps){ g.stage='reveal'; g.deadline=null; g.reveal={c:0,i:0}; H.sendAlbum(); }
    else g.deadline = secs(this.type(g.step)==='draw' ? st.drawTime : st.textTime);
  },
  act(H,pid,m){
    const g=H.S.g, isHost=pid===H.S.hostPid;
    if(m.a==='tel-submit'){
      if(g.stage!=='play' || m.step!==g.step) return;
      const c=this.chainOf(g,pid,g.step); if(c<0 || g.chains[c][g.step]) return;
      const type=this.type(g.step);
      g.chains[c][g.step] = {type, by:pid, data: type==='text' ? cleanText(m.data,120) : cleanStrokes(m.data)};
      if(g.chains.every(ch=>ch[g.step])) this.advance(H);
      H.changed();
    } else if(m.a==='tel-next' && isHost){
      if(g.stage==='play'){ this.fill(g); this.advance(H); }
      else if(g.stage==='reveal'){
        const ch=g.chains[g.reveal.c];
        if(g.reveal.i < ch.length-1) g.reveal.i++;
        else if(g.reveal.c < g.chains.length-1) g.reveal = {c:g.reveal.c+1, i:0};
        else g.stage='done';
      }
      H.changed();
    }
  },
  tick(H,now){ const g=H.S.g; if(g.stage==='play' && g.deadline && now>g.deadline+3500){ this.fill(g); this.advance(H); H.changed(); } },
  view(H,pid){
    const g=H.S.g, inGame=g.order.includes(pid);
    const v = {type:'telephone', id:g.id, stage:g.stage, step:g.step, steps:g.steps, stepType:this.type(g.step), deadline:g.deadline, inGame, total:g.order.length};
    if(g.stage==='play'){
      v.pending = g.chains.map((ch,c)=> ch[g.step] ? null : this.authorOf(g,c,g.step)).filter(Boolean);
      v.doneCount = g.order.length - v.pending.length;
      if(inGame){
        const c=this.chainOf(g,pid,g.step);
        v.submitted = !!g.chains[c][g.step];
        if(!v.submitted){
          const prev = g.step>0 ? g.chains[c][g.step-1] : null;
          v.task = {key:g.id+':'+g.step, type:this.type(g.step), promptType: prev ? prev.type : null, prompt: prev ? prev.data : null};
        }
      }
    } else {
      v.reveal = {c:g.reveal.c, i:g.reveal.i, chains:g.chains.length};
    }
    return v;
  }
};

/* ---------- Крокодил ---------- */
const Croc = {
  start(H){
    const S=H.S, st=S.settings.croc, order=connectedOrder(H);
    S.players.forEach(p=>p.score=0);
    S.g = {type:'croc', id:uid(), mode:st.mode, order, turn:0, total:order.length*st.rounds, used:[], stage:'choose',
      shower:null, options:null, word:null, deadline:null, strokes:[], guesses:[], guessedBy:null, note:null, downSince:null};
    this.begin(H);
  },
  draw(g, level, n){
    let pool = (WORDS[level] || WORDS.easy).filter(w=>!g.used.includes(w));
    if(pool.length<n){ g.used = g.used.filter(w=>!(WORDS[level]||[]).includes(w)); pool = WORDS[level]||WORDS.easy; }
    return shuffle(pool).slice(0,n);
  },
  options(g, level){
    if(level==='mix') return [this.draw(g,'easy',1)[0], this.draw(g,'medium',1)[0], this.draw(g,'hard',1)[0]];
    return this.draw(g, level, 3);
  },
  begin(H){
    const g=H.S.g;
    g.shower = g.order[g.turn % g.order.length];
    g.stage='choose'; g.options=this.options(g, H.S.settings.croc.level); g.word=null;
    g.deadline=Date.now()+20000; g.strokes=[]; g.guesses=[]; g.guessedBy=null; g.note=null; g.downSince=null;
    H.relay({t:'clear', turn:g.turn});
  },
  choose(H,pid,i){
    const g=H.S.g; if(g.stage!=='choose' || pid!==g.shower) return;
    g.word = g.options[i] ?? g.options[0]; g.used.push(g.word); g.options=null;
    g.stage='play'; g.deadline=Date.now()+H.S.settings.croc.time*1000;
  },
  end(H, by, note){
    const g=H.S.g; g.stage='result'; g.guessedBy=by||null; g.note=note||null; g.deadline=Date.now()+7000;
    if(by){ const a=H.player(by), b=H.player(g.shower); if(a) a.score+=2; if(b) b.score+=1; }
  },
  next(H){ const g=H.S.g; g.turn++; if(g.turn>=g.total){ g.stage='final'; g.deadline=null; } else this.begin(H); },
  act(H,pid,m){
    const g=H.S.g, isHost=pid===H.S.hostPid, sh=pid===g.shower;
    switch(m.a){
      case 'croc-choose': this.choose(H,pid,m.i|0); break;
      case 'croc-stroke': {
        if(g.stage!=='play' || g.mode!=='draw' || !sh) return;
        const s=cleanStroke(m.s); if(!s || g.strokes.length>8000) return;
        g.strokes.push(s); H.relay({t:'stroke', turn:g.turn, s}, pid); return;
      }
      case 'croc-undo': if(g.stage!=='play' || !sh) return; g.strokes=g.strokes.filter(s=>s.i!==(m.i|0)); H.relay({t:'undo', turn:g.turn, i:m.i|0}, pid); return;
      case 'croc-clear': if(g.stage!=='play' || !sh) return; g.strokes=[]; H.relay({t:'clear', turn:g.turn}, pid); return;
      case 'croc-guess': {
        if(g.stage!=='play' || g.mode!=='draw' || sh || !g.order.includes(pid)) return;
        const t=cleanText(m.text,40); if(!t) return;
        const ok = norm(t)===norm(g.word);

      case 'croc-skip': {
        if(g.stage!=='play' || !sh) return;

        g.word = this.draw(g, lvl==='mix' ? pick(['easy','medium','hard']) : lvl, 1)[0]; g.used.push(g.word);
        if(g.mode==='draw'){ g.strokes=[]; H.relay({t:'clear', turn:g.turn}); }
        break;
      }
      case 'croc-giveup': if(g.stage==='play' && (sh||isHost)) this.end(H, null, 'giveup'); else return; break;
      case 'croc-next':
        if(!isHost) return;
        if(g.stage==='result') this.next(H);
        else if(g.stage==='choose' || g.stage==='play') this.end(H, null, 'skip');

        break;
      default: return;
    }
    H.changed();
  },
  tick(H,now){
    const g=H.S.g; let ch=false;

      const s=H.player(g.shower);

    else if(g.stage==='play' && now>g.deadline){ this.end(H, null, 'time'); ch=true; }
    else if(g.stage==='result' && now>g.deadline){ this.next(H); ch=true; }
    if(ch) H.changed();
  },
  view(H,pid){
    const g=H.S.g, sh=pid===g.shower;
    const v = {type:'croc', id:g.id, mode:g.mode, stage:g.stage, turn:g.turn, total:g.total, perRound:g.order.length, shower:g.shower, isShower:sh,
      inGame:g.order.includes(pid), deadline:g.deadline, guessedBy:g.guessedBy, note:g.note, guesses:g.guesses.slice(-30)};
    if(g.stage==='choose' && sh) v.options=g.options;

    if(g.stage==='result') v.word=g.word;
    return v;
  }
};

/* ---------- Шпион ---------- */
const Spy = {
  start(H){
    const S=H.S, st=S.settings.spy, order=connectedOrder(H), N=order.length;
    const k = (st.spies===2 && N>=6) ? 2 : 1;
    const pack = SPY_PACKS[st.pack] ? st.pack : 'places', ALL = SPY_PACKS[pack].items;
    let locs = ALL.filter(l=>!(S.spyRecent||[]).includes(l.n)); if(!locs.length) locs=ALL;
    const loc = pick(locs); S.spyRecent = (S.spyRecent||[]).slice(-12).concat(loc.n);
    const spies = shuffle(order).slice(0,k); const roles={}; const rl=loc.r ? shuffle(loc.r) : null; let ri=0;
    if(rl) order.forEach(p=>{ if(!spies.includes(p)) roles[p]=rl[ri++ % rl.length]; });
    S.g = {type:'spy', id:uid(), pack, order, stage:'cards', loc:loc.n, spies, roles, ready:[], deadline:null, left:st.time*1000,
      votes:{}, voteFinal:false, tie:false, caller:null, first:pick(order), result:null, round:0};
  },
  live(H){ return H.S.g.order.filter(p=>H.player(p)?.connected); },
  talk(H){ const g=H.S.g; g.stage='talk'; g.deadline=Date.now()+g.left; g.votes={}; },
  finish(H, win, reason, extra){ const g=H.S.g; g.stage='result'; g.deadline=null; g.result=Object.assign({win, reason}, extra||{}); },
  checkReady(H){ const g=H.S.g; if(g.stage==='cards' && this.live(H).every(p=>g.ready.includes(p))) this.talk(H); },
  checkVotes(H){
    const g=H.S.g; if(g.stage!=='vote') return false;
    const voters=this.live(H); if(!voters.length || !voters.every(p=>g.votes[p])) return false;
    const cnt={}; Object.values(g.votes).forEach(t=>cnt[t]=(cnt[t]||0)+1);
    const max=Math.max(...Object.values(cnt)); const leaders=Object.keys(cnt).filter(k=>cnt[k]===max);
    if(leaders.length===1){
      const acc=leaders[0];
      if(g.spies.includes(acc)) this.finish(H,'civ','caught',{accused:acc});
      else this.finish(H,'spy','wrong',{accused:acc});
    } else if(!g.voteFinal && g.left>15000){ g.tie=true; g.round++; this.talk(H); }
    else this.finish(H,'spy','tie');
    return true;
  },
  act(H,pid,m){
    const g=H.S.g, isHost=pid===H.S.hostPid, inG=g.order.includes(pid);
    switch(m.a){
      case 'spy-ready': if(g.stage!=='cards' || !inG || g.ready.includes(pid)) return; g.ready.push(pid); this.checkReady(H); break;
      case 'spy-start': if(!isHost || g.stage!=='cards') return; this.talk(H); break;
      case 'spy-callvote': if(g.stage!=='talk' || !inG) return; g.left=Math.max(0, g.deadline-Date.now()); g.stage='vote'; g.votes={}; g.caller=pid; g.voteFinal=false; g.tie=false; g.deadline=null; break;
      case 'spy-cancelvote': if(g.stage!=='vote' || g.voteFinal || !(pid===g.caller || isHost)) return; g.round++; this.talk(H); break;
      case 'spy-vote': if(g.stage!=='vote' || !inG || !g.order.includes(m.target) || m.target===pid) return; g.votes[pid]=m.target; this.checkVotes(H); break;
      case 'spy-guess': {
        if(!(g.stage==='talk' || g.stage==='vote') || !g.spies.includes(pid)) return;
        const guess=cleanText(m.loc,60); const ok = guess===g.loc;
        this.finish(H, ok?'spy':'civ', ok?'guessed':'missed', {guesser:pid, guess});
        break;
      }
      default: return;
    }
    H.changed();
  },
  tick(H,now){
    const g=H.S.g;
    if(g.stage==='talk' && now>g.deadline){ g.left=0; g.stage='vote'; g.voteFinal=true; g.votes={}; g.caller=null; g.deadline=null; H.changed(); }
    else if(g.stage==='cards'){ const before=g.stage; this.checkReady(H); if(g.stage!==before) H.changed(); }
    else if(g.stage==='vote'){ if(this.checkVotes(H)) H.changed(); }
  },
  view(H,pid){
    const g=H.S.g, inG=g.order.includes(pid), isSpy=g.spies.includes(pid);
    const v = {type:'spy', id:g.id, pack:g.pack, stage:g.stage, inGame:inG, isSpy, spyCount:g.spies.length, deadline:g.deadline, left:g.left, first:g.first,
      ready:g.ready.includes(pid), readyCount:g.ready.length, total:g.order.length, order:g.order, voted:Object.keys(g.votes).length,
      myVote:g.votes[pid]||null, voteFinal:g.voteFinal, tie:g.tie, caller:g.caller, round:g.round};
    if(inG && !isSpy){ v.loc=g.loc; v.role=g.roles[pid]; }
    if(g.stage==='result'){ v.loc=g.loc; v.spies=g.spies; v.result=g.result; }
    return v;
  }
};
/* ---------- Создай мем ---------- */
const Meme = {
  start(H){
    const S=H.S; S.players.forEach(p=>{ p.score=0; p.mid=0; });
    S.g = {type:'meme', id:uid(), round:0, rounds:S.settings.meme.rounds, stage:'loading', order:[], deadline:null,
      pics:{}, caps:{}, done:{}, rerolled:{}, used:[], queue:[], qi:0, votes:{}, results:[]};
    const id=S.g.id;
    this.loadPool(H).then(ok=>{
      const g=H.S && H.S.g; if(!g || g.id!==id || g.stage!=='loading') return;
      if(ok) this.beginRound(H); else g.stage='error';
      H.changed();
    });
  },
  loadPool(H){
    if(H.memePool && H.memePool.length) return Promise.resolve(true);
    return fetch(MEME_API).then(r=>r.json()).then(j=>{
      const list=((j && j.data && j.data.memes) || []).filter(m=>MEME_URL_RE.test(m.url)).map(m=>({u:m.url, w:m.width|0, h:m.height|0}));
      H.memePool=list; return list.length>0;
    }).catch(()=>false);
  },
  pickPic(H,g){ let pool=H.memePool.filter(m=>!g.used.includes(m.u)); if(!pool.length){ g.used=[]; pool=H.memePool.slice(); } const m=pick(pool); g.used.push(m.u); return m; },
  live(H){ return H.S.players.filter(p=>p.connected && !p.left).map(p=>p.pid); },
  beginRound(H){
    const g=H.S.g;
    g.round++; g.order=this.live(H); g.pics={}; g.caps={}; g.done={}; g.rerolled={}; g.queue=[]; g.qi=0; g.votes={};
    g.order.forEach(p=>{ g.pics[p]=this.pickPic(H,g,p); });
    g.stage='write'; g.deadline=Date.now()+H.S.settings[g.type].time*1000;
  },
  checkWrite(H){
    const g=H.S.g; if(g.stage!=='write') return false;
    const need=g.order.filter(p=>H.player(p)?.connected);
    if(g.order.some(p=>g.done[p]) && need.every(p=>g.done[p])){ this.endWrite(H); return true; }
    return false;
  },
  endWrite(H){ const g=H.S.g; g.queue=shuffle(g.order.filter(p=>g.caps[p])); g.qi=0; if(g.queue.length) this.beginVote(H); else this.board(H); },
  beginVote(H){ const g=H.S.g; g.stage='vote'; g.votes={}; g.deadline=Date.now()+20000; },
  voters(H){ const g=H.S.g, a=g.queue[g.qi]; return H.S.players.filter(p=>p.connected && !p.left && p.pid!==a).map(p=>p.pid); },
  checkVotes(H){ const g=H.S.g; if(g.stage!=='vote') return false; const vs=this.voters(H); if(!vs.length || vs.every(p=>g.votes[p]!=null)){ this.reveal(H); return true; } return false; },
  reveal(H){
    const g=H.S.g, a=g.queue[g.qi], c=[0,0,0];
    Object.values(g.votes).forEach(x=>{ c[x]++; });
    const p=H.player(a); if(p){ p.score+=c[2]; p.mid=(p.mid||0)+c[1]; }
    g.results.push(Object.assign({round:g.round, pid:a, text:g.caps[a], c}, g.pics[a]));
    if(g.results.length>80) g.results.shift();
    g.stage='reveal'; g.deadline=Date.now()+6000;
  },
  nextMeme(H){ const g=H.S.g; g.qi++; if(g.qi<g.queue.length) this.beginVote(H); else this.board(H); },
  board(H){ const g=H.S.g; g.stage='board'; g.deadline=Date.now()+12000; },
  nextRound(H){ const g=H.S.g; if(g.round>=g.rounds){ g.stage='final'; g.deadline = H.S.public ? Date.now()+30000 : null; } else this.beginRound(H); },
  act(H,pid,m){
    const g=H.S.g, isHost=pid===H.S.hostPid && !H.S.public;
    switch(m.a){
      case 'meme-cap': {
        if(g.stage!=='write' || !g.order.includes(pid) || g.done[pid]) return;
        const t=cleanText(m.text,140); if(!t && !m.auto) return;
        g.done[pid]=true; if(t) g.caps[pid]=t;
        this.checkWrite(H); break;
      }
      case 'meme-reroll': if(g.stage!=='write' || !g.order.includes(pid) || g.rerolled[pid] || g.done[pid]) return; g.rerolled[pid]=true; g.pics[pid]=this.pickPic(H,g,pid); break;
      case 'meme-vote': {
        if(g.stage!=='vote') return; const v=m.v|0; if(v<0 || v>2 || !this.voters(H).includes(pid)) return;
        g.votes[pid]=v; this.checkVotes(H); break;
      }
      case 'meme-next':
        if(!isHost) return;
        if(g.stage==='write') this.endWrite(H);
        else if(g.stage==='vote') this.reveal(H);
        else if(g.stage==='reveal') this.nextMeme(H);
        else if(g.stage==='board') this.nextRound(H);
        else if(g.stage==='error'){ this.start(H); return; }
        else return;
        break;
      default: return;
    }
    H.changed();
  },
  tick(H,now){
    const g=H.S.g; let ch=false;
    if(g.stage==='write'){ ch = this.checkWrite(H) || (now>g.deadline+3500 && (this.endWrite(H), true)); }
    else if(g.stage==='vote'){ ch = this.checkVotes(H) || (now>g.deadline && (this.reveal(H), true)); }
    else if(g.stage==='reveal' && now>g.deadline){ this.nextMeme(H); ch=true; }
    else if(g.stage==='board' && now>g.deadline){ this.nextRound(H); ch=true; }
    else if(g.stage==='final' && H.S.public && now>g.deadline){
      H.S.players=H.S.players.filter(p=>!p.left);
      if(this.live(H).length>=GAMES.meme.min) this.start(H); else { H.S.phase='lobby'; H.S.g=null; }
      ch=true;
    }
    if(ch) H.changed();
  },
  view(H,pid){
    const g=H.S.g, inR=g.order.includes(pid);
    const v = {type:g.type, id:g.id, stage:g.stage, round:g.round, rounds:g.rounds, deadline:g.deadline, inRound:inR};
    if(g.stage==='write'){
      v.total=g.order.length; v.pending=g.order.filter(p=>!g.done[p]); v.doneCount=v.total-v.pending.length;
      if(inR){ v.pic=g.pics[pid]; v.done=!!g.done[pid]; v.myText=g.caps[pid]||''; v.rerolled=!!g.rerolled[pid]; }
    }
    if(g.stage==='vote' || g.stage==='reveal'){
      const a=g.queue[g.qi];
      v.cur=Object.assign({text:g.caps[a], idx:g.qi+1, of:g.queue.length, mine:a===pid}, g.pics[a]);
      v.myVote = g.votes[pid] ?? null; v.voted=Object.keys(g.votes).length; v.voters=this.voters(H).length;
      if(g.stage==='reveal'){ const r=g.results[g.results.length-1]; v.cur.author=a; v.cur.c=r.c; }
    }
    const rank=(a,b)=>b.c[2]-a.c[2] || b.c[1]-a.c[1] || a.c[0]-b.c[0];
    if(g.stage==='board') v.roundMemes=g.results.filter(r=>r.round===g.round).sort(rank);
    if(g.stage==='final') v.best=g.results.slice().sort(rank)[0] || null;
    return v;
  }
};
/* ---------- Закончи предложение: the same round/vote engine, text instead of pictures ---------- */
const Finish = Object.assign({}, Meme, {
  start(H){
    const S=H.S; S.players.forEach(p=>{ p.score=0; p.mid=0; });
    S.g = {type:'finish', id:uid(), round:0, rounds:S.settings.finish.rounds, stage:'write', order:[], deadline:null,
      pics:{}, caps:{}, done:{}, rerolled:{}, used:[], queue:[], qi:0, votes:{}, results:[]};
    this.beginRound(H);
  },
  pickPic(H,g,pid){
    let idx=FINISH.map((_,i)=>i).filter(i=>!g.used.includes(i)); if(!idx.length){ g.used=[]; idx=FINISH.map((_,i)=>i); }
    const i=pick(idx); g.used.push(i);
    const mine = H.S.settings.finish.names!=='random' ? shuffle(H.S.players.filter(p=>p.pid!==pid && !p.left).map(p=>p.name)) : [];
    const names=[...new Set(mine.concat(shuffle(FINISH_NAMES)))];
    const t=FINISH[i].split('{A}').join(names[0]).split('{B}').join(names[1]);
    return {t: t.charAt(0).toUpperCase()+t.slice(1)};
  }
});

/* =====================================================================
   CLIENT — connects to the host
   ===================================================================== */
const Client = {
  link:null, bi:0, cid:null, code:null, lastMsg:0, tickT:null, everConnected:false, active:false, lastPing:0, lastHello:0, tries:0, linkAt:0,
  join(code, keepPid){
    this.code=code; this.active=true; this.everConnected=false; this.tries=0; this.cid=uid(); this.public = code===PUBLIC_CODE; this.helloAt=0; this.hostLeftAt=0;
    App.role='client'; App.code=code; App.view=null;
    App.pid = keepPid || claimPid(code); if(keepPid) ss('balagan-pid-'+code, keepPid);
    if(location.hash.slice(1)!==code) history.replaceState(null,'','#'+code);
    showConnecting();
    this.bi = clamp(store.get('balagan-broker',0)|0, 0, BROKERS.length-1);
    this.openLink();
    clearInterval(this.tickT); this.tickT=setInterval(()=>this.tick(), 1000);
  },
  base(){ return NS+this.code; },
  openLink(){
    if(this.link){ const old=this.link; this.link=null; try{ old.close(); }catch(e){} }
    const L = makeLink(BROKERS[this.bi], {clientId:'bc'+this.cid, will:{topic:this.base()+'/h', payload:JSON.stringify({c:this.cid, bye:true})},
      onState: ok=>{ if(this.link!==L) return; if(ok) this.hello(); else setNet(false); },
      onMessage: (t,m)=>{ if(this.link===L) this.onData(m); }});
    this.link=L; this.linkAt=Date.now();
    L.subscribe(this.base()+'/p/'+this.cid); L.connect();
  },
  raw(d){ return !!(this.link && this.link.ok && this.link.send(this.base()+'/h', {c:this.cid, d})); },
  hello(){ this.lastHello=Date.now(); if(!this.helloAt) this.helloAt=this.lastHello; this.raw({t:'hello', pid:App.pid, name:App.me.name, color:App.me.color}); },
  onData(m){
    if(!m || typeof m!=='object' || !this.active) return;
    this.lastMsg=Date.now();
    if(m.t==='rehello' || m.t==='rehost'){ this.hello(); return; }
    if(m.t==='hostleft'){ this.hostLeftAt=Date.now(); this.lastMsg=Date.now()-10000; return; }
    if(!this.everConnected){ this.everConnected=true; store.set('balagan-broker', this.bi); }
    if(!App.netOk) setNet(true);
    onMessage(m);
  },
  stop(){
    this.active=false; clearInterval(this.tickT);
    const L=this.link; this.link=null;
    if(L){ try{ if(L.ok) L.send(this.base()+'/h', {c:this.cid, bye:true}); }catch(e){} setTimeout(()=>{ try{ L.close(); }catch(e){} }, 300); }
  },
  tick(){
    if(!this.active || !this.link) return;
    const now=Date.now();
    if(!this.everConnected){
      if(this.public && this.link.ok && this.helloAt && now-this.helloAt>5000){ this.becomeHost(); return; }
      if(now-this.linkAt > 7000){
        this.tries++;
        if(this.tries >= BROKERS.length+1){ leaveRoom('Комната '+this.code+' не найдена. Проверьте код и что у ведущего открыта игра.'); return; }
        this.bi=(this.bi+1)%BROKERS.length; this.openLink(); return;
      }
      if(this.link.ok && now-this.lastHello>2500) this.hello();
      return;
    }
    if(this.link.ok && now-this.lastPing>3000){ this.lastPing=now; this.raw({t:'ping'}); }
    if(now-this.lastMsg>11000){ setNet(false); if(this.link.ok && now-this.lastHello>4000) this.hello(); }
    if(this.public && now-this.lastMsg>9000){
      const v=App.view, next=v && v.players.filter(p=>p.on && p.pid!==v.hostPid)[0];
      if((next && next.pid===App.pid) || now-this.lastMsg>20000+(this.jit||(this.jit=Math.random()*4000))){ this.becomeHost(); return; }
    }
    if(BROKERS.length>1 && now-this.lastMsg>30000 && now-this.linkAt>30000){ this.bi=(this.bi+1)%BROKERS.length; this.openLink(); }
  },
  becomeHost(){
    const carry = App.view ? App.view.players.filter(p=>p.pid!==App.view.hostPid) : [];
    const pid=App.pid; this.stop(); App.role=null;
    Host.createPublic(App.me, pid, carry);
  },
  wake(){
    if(!this.active) return;
    if(!this.link || !this.link.ok) this.openLink(); else if(Date.now()-this.lastMsg>6000) this.hello();
  },
  send(m){
    if(this.raw(Object.assign({t:'act'}, m))) return true;
    toast('Нет связи с ведущим — переподключаемся'); this.wake(); return false;
  }
};
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ Client.wake(); if(App.view && App.view.phase==='game') { wakeLock=null; keepAwake(); } } });

function leaveRoom(msg){
  if(App.role==='client'){ Client.stop(); store.del('balagan-last'); }
  if(App.role==='host'){ Host.close(); }
  App.role=null; App.view=null; App.code=null; App.album=null;
  history.replaceState(null,'',location.pathname+location.search);
  setNet(true); showLanding(msg);
}

let cur = {key:null, inst:null};
function mountEl(key, inst){ cur.inst?.destroy?.(); cur={key, inst}; $('#app').replaceChildren(inst.el); window.scrollTo(0,0); }
const P = pid => App.view?.players.find(p=>p.pid===pid) || {pid, name:'Игрок', color:AV_COLORS[3], on:false};
const nameOf = pid => P(pid).name;
function av(pid, cls=''){ const p=P(pid); return `<span class="av ${cls} ${p.on?'':'off'}" style="--c:${esc(p.color)}" aria-hidden="true">${esc((p.name||'?').trim().charAt(0)||'?')}</span>`; }
const timerHtml = (dl, cls='') => { if(!dl) return ''; const l=Math.max(0, Math.ceil((dl-serverNow())/1000)); return `<span class="timer ${cls} ${l<=10?'low':''}" data-deadline="${dl}">${fmtSec(l)}</span>`; };
function gameHead(type, extra=''){ return `<div class="ghead"><span class="gname" style="--gc:${GAMES[type].color}">${GAMES[type].name}</span>${extra}</div>`; }
function scoreboard(players, highlight){
  const rows = players.slice().sort((a,b)=>b.score-a.score);
  let place=0, last=null;
  return `<div class="score">${rows.map((p,i)=>{ if(p.score!==last){ place=i+1; last=p.score; }
    return `<div class="srow ${place===1&&p.score>0?'first':''}"><span class="pl">${place}</span>${av(p.pid,'sm')}<span class="nm">${esc(p.name)}${p.pid===App.view.me?' <span class="tag me">вы</span>':''}${highlight&&highlight[p.pid]?` <span class="tag host">+${highlight[p.pid]}</span>`:''}</span><span class="pts">${p.score}</span></div>`; }).join('')}</div>`;
}

function render(){
  const v=App.view; if(!v) return;
  const [key, Scr] = screenFor(v);
  if(key!==cur.key) mountEl(key, Scr.mount(v));
  else cur.inst.update?.(v);
  renderBar(v);
  if(v.phase==='game') keepAwake();
}
function screenFor(v){
  const g=v.g;
  if(v.phase==='lobby' || !g) return v.public ? ['publobby', PublicLobby] : ['lobby', Lobby];
  if(g.type==='meme' || g.type==='finish'){
    if(g.stage==='loading' || g.stage==='error') return ['meme-'+g.stage+'-'+g.id, MemeStatus];
    if(g.stage==='write') return ['meme-w-'+g.id+'-'+g.round+'-'+(g.inRound && !g.done ? 't' : 'w'), g.inRound && !g.done ? MemeWrite : MemeWait];
    if(g.stage==='vote' || g.stage==='reveal') return ['meme-s-'+g.id+'-'+g.round+'-'+g.cur.idx, MemeShow];
    if(g.stage==='board') return ['meme-b-'+g.id+'-'+g.round, MemeBoard];
    return ['meme-f-'+g.id, MemeFinal];
  }
  if(g.type==='telephone'){
    if(g.stage==='play'){
      if(!g.inGame) return ['tel-spec-'+g.id, TelWait];
      if(g.submitted) return ['tel-wait-'+g.id+'-'+g.step, TelWait];
      return ['tel-task-'+g.id+'-'+g.step, TelTask];
    }
    return ['tel-album-'+g.id, TelAlbum];
  }
  if(g.type==='croc'){
    if(g.stage==='final') return ['croc-final-'+g.id, CrocFinal];
    if(g.stage==='choose') return ['croc-choose-'+g.id+'-'+g.turn, CrocChoose];
    if(g.stage==='play') return ['croc-play-'+g.id+'-'+g.turn+'-'+(g.isShower?'s':'g'), g.mode==='draw' ? CrocDraw : CrocAct];
    return ['croc-res-'+g.id+'-'+g.turn, CrocResult];
  }
  if(g.type==='spy'){
    if(!g.inGame && g.stage!=='result') return ['spy-spec-'+g.id, Spectate];
    return ['spy-'+g.stage+'-'+g.id+'-'+g.round, {cards:SpyCards, talk:SpyTalk, vote:SpyVote, result:SpyResult}[g.stage]];
  }
  return ['lobby', Lobby];
}
function renderBar(v){
  const bar=$('#bar'); bar.hidden=false;
  const on=v.players.filter(p=>p.on).length;
  if(!bar._built){
    bar.innerHTML = `<button class="chip" data-act="copy" aria-label="Скопировать ссылку на комнату"><span class="dot"></span><span class="code"></span></button><span class="chip cnt"></span><span class="spacer"></span><button class="bar-btn" data-act="exit">Выйти</button>`;
    bar.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='copy') copyText(roomLink(App.code));

      if(b.dataset.act==='exit') armed(b, App.role==='host' && !App.view?.public ? 'Закрыть комнату для всех?' : 'Точно выйти?', ()=>{ if(App.role==='client'){ act('leave'); setTimeout(()=>leaveRoom(), 300); } else leaveRoom(); });
    });
    bar._built=true;
  }
  $('.code', bar).textContent = v.public ? 'Открытая' : v.code;
  $('.cnt', bar).textContent = on+' онлайн';
  $('.dot', bar).classList.toggle('off', App.netOk===false);
}
/* timers */
setInterval(()=>{
  const now=serverNow();
  $$('[data-deadline]').forEach(t=>{
    const left=Math.max(0, Math.ceil((+t.dataset.deadline - now)/1000));
    t.textContent=fmtSec(left); t.classList.toggle('low', left<=10);
  });
  cur.inst?.onTick?.(now);
}, 250);

/* =====================================================================
   Drawing pad (shared by telephone and crocodile)
   coordinates: 1000 × 750 logical units
   ===================================================================== */
const PAD_W=1000, PAD_H=750;
let strokeSeq = Math.floor(Math.random()*1e6)*10;
function Pad({editable=false, strokes=[], onChunk=null, onUndo=null, onClear=null}={}){
  const root = el(`<div class="pad"><div class="paper"><canvas aria-label="${editable?'Холст для рисования':'Рисунок'}"></canvas></div></div>`);
  const paper = $('.paper', root), canvas=$('canvas', root), ctx=canvas.getContext('2d');
  let list = strokes.slice(), scale=1, color=INK_COLORS[0], width=10, eraser=false, curS=null, flushT=null;
  function drawStroke(s){
    const p=s.p, k=scale; ctx.strokeStyle=s.c; ctx.fillStyle=s.c; ctx.lineWidth=s.w*k; ctx.lineCap='round'; ctx.lineJoin='round';
    if(p.length<=2 || (p.length===4 && p[0]===p[2] && p[1]===p[3])){ ctx.beginPath(); ctx.arc(p[0]*k, p[1]*k, s.w*k/2, 0, Math.PI*2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(p[0]*k, p[1]*k); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i]*k, p[i+1]*k); ctx.stroke();
  }
  function redraw(){ ctx.fillStyle=SHEET; ctx.fillRect(0,0,canvas.width,canvas.height); list.forEach(drawStroke); }
  function resize(){
    const r=paper.getBoundingClientRect(); if(!r.width) return;
    const dpr=Math.min(window.devicePixelRatio||1, 2.5);
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.width*0.75*dpr); scale=canvas.width/PAD_W; redraw();
  }
  const ro = new ResizeObserver(resize); ro.observe(paper);
  function pt(e){ const r=canvas.getBoundingClientRect(); return [clamp(Math.round((e.clientX-r.left)/r.width*PAD_W),0,PAD_W), clamp(Math.round((e.clientY-r.top)/r.height*PAD_H),0,PAD_H)]; }
  function flush(){
    if(!curS || !onChunk) return;
    if(curS.p.length>curS.sent){ const from=Math.max(0, curS.sent-2); onChunk({i:curS.i, c:curS.c, w:curS.w, p:curS.p.slice(from)}); curS.sent=curS.p.length; }
  }
  if(editable){
    root.insertAdjacentHTML('beforeend', `<div class="tools">
      <div class="colors">${INK_COLORS.map((c,i)=>`<button class="sw" style="--c:${c}" data-c="${c}" aria-label="Цвет" aria-pressed="${i===0}"></button>`).join('')}</div>
      <div class="toolrow">
        ${[[5,6],[10,11],[24,20]].map(([w,d])=>`<button class="tool" data-w="${w}" aria-label="Толщина ${w}" aria-pressed="${w===10}"><span class="d" style="width:${d}px;height:${d}px"></span></button>`).join('')}
        <button class="tool" data-tool="eraser" aria-pressed="false">Ластик</button>
        <button class="tool" data-tool="undo">Отменить</button>
        <button class="tool" data-tool="clear">Очистить</button>
      </div></div>`);
    root.addEventListener('click', e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.c){ color=b.dataset.c; eraser=false; $$('.sw',root).forEach(x=>x.setAttribute('aria-pressed', x===b)); $('[data-tool=eraser]',root).setAttribute('aria-pressed','false'); }
      else if(b.dataset.w){ width=+b.dataset.w; $$('[data-w]',root).forEach(x=>x.setAttribute('aria-pressed', x===b)); }
      else if(b.dataset.tool==='eraser'){ eraser=!eraser; b.setAttribute('aria-pressed', eraser); }
      else if(b.dataset.tool==='undo'){ const last=list[list.length-1]; if(!last) return; list=list.filter(s=>s.i!==last.i); redraw(); onUndo&&onUndo(last.i); }
      else if(b.dataset.tool==='clear'){ if(!list.length) return; armed(b, 'Стереть всё?', ()=>{ list=[]; redraw(); onClear&&onClear(); }); }
    });
    canvas.addEventListener('pointerdown', e=>{
      if(e.button>0) return; e.preventDefault(); canvas.setPointerCapture(e.pointerId);
      const [x,y]=pt(e); const w = eraser ? Math.max(width*2.4, 24) : width;
      curS={i:++strokeSeq, c: eraser ? SHEET : color, w, p:[x,y], sent:0};
      list.push(curS); drawStroke(curS);
      if(onChunk){ clearInterval(flushT); flushT=setInterval(flush, 100); }
    });
    canvas.addEventListener('pointermove', e=>{
      if(!curS) return; e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for(const ev of evs){
        const [x,y]=pt(ev); const n=curS.p.length, lx=curS.p[n-2], ly=curS.p[n-1];
        if(Math.abs(x-lx)+Math.abs(y-ly) < 3) continue;
        curS.p.push(x,y);
        ctx.strokeStyle=curS.c; ctx.lineWidth=curS.w*scale; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(lx*scale, ly*scale); ctx.lineTo(x*scale, y*scale); ctx.stroke();
      }
    });
    const up = ()=>{ if(!curS) return; flush(); clearInterval(flushT); flushT=null; const s=curS; curS=null; delete s.sent; };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up); canvas.addEventListener('lostpointercapture', up);
  }
  return {
    el:root,
    strokes: ()=> list.map(s=>({i:s.i, c:s.c, w:s.w, p:s.p.slice()})),
    add(s){ list.push(s); drawStroke(s); },
    remove(i){ list=list.filter(s=>s.i!==i); redraw(); },
    clear(){ list=[]; redraw(); },
    set(all){ list=all.slice(); redraw(); },
    destroy(){ ro.disconnect(); clearInterval(flushT); }
  };
}

  cur={key:'connecting', inst:null}; $('#bar').hidden=true;
  $('#app').replaceChildren(el(`<section class="big-wait" style="padding-top:80px"><div class="spinner"></div><h2>Заходим в комнату ${esc(App.code)}</h2><p class="muted">Соединяемся с ведущим…</p><button class="btn ghost" id="cancel-join">Отмена</button></section>`));
  $('#cancel-join').onclick = ()=> leaveRoom();
}

  const node = el(`<section class="stack" style="gap:22px">
    <div class="hero">
      <div class="logo" data-t="Балаган"><span>Балаган</span></div>

    <div class="card stack" style="gap:16px">

      <div class="field"><label>Твой цвет</label><div class="swatches-av">${AV_COLORS.map(c=>`<button class="swatch-av" style="--c:${c}" data-color="${c}" aria-label="Цвет" aria-pressed="${c===me.color}"></button>`).join('')}</div></div>
      <p class="err" id="err" ${err?'':'hidden'}>${esc(err||'')}</p>
      ${hashCode.length===4 ? `
        <button class="btn primary big" data-act="join-hash">${hashCode===PUBLIC_CODE?'Войти в открытую комнату':'Войти в комнату '+esc(hashCode)}</button>
        <div class="or">или</div>
        <button class="btn ghost wide" data-act="create">Создать свою комнату</button>` : `
        <button class="btn primary big" data-act="create">Создать комнату</button>
        <button class="btn big pubbtn" data-act="public"><span>Открытая комната</span><small>«Создай мем» со всеми, кто сейчас на сайте</small></button>
        <div class="or">или войти по коду</div>
        <div class="row"><input class="input code-input grow" id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="КОД" aria-label="Код комнаты"><button class="btn" data-act="join">Войти</button></div>`}

  $('#app').replaceChildren(node);
}
function nameFromHost(S){ const p=S.players.find(p=>p.pid===S.hostPid); return p?p.name:'Ведущий'; }

/* ---------- Lobby ---------- */
const Lobby = {
  mount(v){
    const node = el(`<section class="stack" style="gap:18px">
      <div class="card roomcode">
        <div class="stack" style="gap:6px;min-width:0">
          <div class="eyebrow">Код комнаты</div>
          <div class="big">${esc(v.code)}</div>

      </div>

      <div class="card stack" id="gset"></div>

      if(v.isHost){

const TelTask = {
  mount(v){

    const node = el(`<section class="stack" style="gap:16px;--gc:var(--pink)">

    </section>`);
    const body=$('#body',node);
    let pad=null, sent=false, sentAt=0;
    const submit = (auto)=>{
      if(sent) return;
      const data = t.type==='text' ? cleanText($('#tt',node)?.value, 120) : pad.strokes();
      if(!auto && t.type==='text' && !data){ toast('Напишите хоть что-нибудь'); return; }
      if(!auto && t.type==='draw' && !data.length){ toast('Нарисуйте хоть что-нибудь'); return; }
      if(act('tel-submit', {step:g.step, data})){ sent=true; sentAt=Date.now(); body.style.opacity=.5; body.style.pointerEvents='none'; }
    };
    if(t.type==='text'){
      if(t.promptType==null){
        body.innerHTML = `<h2>Придумай фразу</h2><p class="muted">Что-нибудь смешное, что можно нарисовать. Её получит следующий игрок.</p>
          <textarea class="input" id="tt" rows="3" maxlength="120" placeholder="Например: ${esc(pick(PHRASES))}"></textarea>
          <div class="row"><button class="btn ghost" data-act="rand">Случайная фраза</button><span class="spacer"></span><button class="btn primary" data-act="go">Готово</button></div>`;
      } else {
        const has = Array.isArray(prompt) && prompt.length;
        body.innerHTML = `<h2>Что здесь нарисовано?</h2><div id="view"></div>${has?'':'<p class="muted">Предыдущий игрок ничего не нарисовал. Придумайте свою фразу.</p>'}
          <textarea class="input" id="tt" rows="2" maxlength="120" placeholder="Опишите рисунок одной фразой"></textarea>
          <div class="row"><span class="spacer"></span><button class="btn primary" data-act="go">Готово</button></div>`;
        if(prompt===undefined){ act('resync'); $('#view',body).innerHTML='<p class="muted">Загружаем рисунок…</p>'; }
        else { const vp=Pad({strokes: prompt||[]}); $('#view',body).appendChild(vp.el); pad=null; node._vp=vp; }
      }
    } else {
      const txt = typeof prompt==='string' ? prompt : '';
      body.innerHTML = `<div class="stack" style="gap:8px"><span class="eyebrow">Нарисуй</span>${txt?`<div class="quote">${esc(txt)}</div>`:`<p class="muted">Вам досталась пустая фраза — нарисуйте что угодно.</p>`}</div><div id="padbox"></div>
        <div class="row"><span class="small muted grow">Без букв и цифр — только рисунок.</span><button class="btn primary" data-act="go">Готово</button></div>`;
      pad = Pad({editable:true}); $('#padbox',body).appendChild(pad.el);
    }
    node.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;

      if(b.dataset.act==='go') submit(false);

    return {el:node,
      update(v){

    };
  }
